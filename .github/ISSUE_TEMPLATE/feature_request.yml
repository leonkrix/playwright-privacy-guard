name: Idea or request
description: A rule, an option or something else that would help.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to protect?
      description: Describe the page and what it must (not) do, for example "no request to another origin before the visitor accepts". The problem matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
