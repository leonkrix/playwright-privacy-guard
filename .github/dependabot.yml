version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The tooling (typescript-eslint) lags behind new TypeScript and ESLint majors
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # Must match the Node major in .nvmrc
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
